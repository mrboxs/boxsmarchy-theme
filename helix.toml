"keyword" = { fg = "purple", modifiers = ["bold"] }
"keyword.control" = { fg = "purple", modifiers = ["bold"] }
"keyword.operator" = { fg = "purple", modifiers = ["bold"] }
"keyword.storage" = { fg = "purple", modifiers = ["bold"] }
"function" = { fg = "blue", modifiers = ["bold"] }
"function.builtin" = { fg = "cyan", modifiers = ["bold"] }
"function.macro" = { fg = "purple", modifiers = ["bold"] }
"constructor" = { fg = "yellow", modifiers = ["bold"] }
"type" = { fg = "yellow", modifiers = ["bold"] }
"type.builtin" = { fg = "yellow", modifiers = ["bold"] }
"type.enum.variant" = "orange"
"constant" = "orange"
"constant.builtin" = "orange"
"constant.numeric" = "orange"
"constant.character" = "green"
"constant.character.escape" = "cyan"
"string" = "green"
"string.regexp" = "cyan"
"string.special" = "cyan"
"comment" = { fg = "comment", modifiers = ["italic"] }
"variable" = "red"
"variable.parameter" = "red"
"variable.builtin" = "yellow"
"variable.other.member" = "red"
"label" = "red"
"punctuation" = "syntax"
"punctuation.special" = "cyan"
"operator" = { fg = "purple", modifiers = ["bold"] }
"tag" = { fg = "red", modifiers = ["bold"] }
"namespace" = { fg = "yellow", modifiers = ["bold"] }
"special" = "cyan"
"attribute" = "orange"

"markup.heading" = { fg = "red", modifiers = ["bold"] }
"markup.list" = "red"
"markup.list.unchecked" = "comment"
"markup.list.checked" = "green"
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.url" = { fg = "cyan", modifiers = ["underlined"] }
"markup.link.text" = "blue"
"markup.link.label" = "purple"
"markup.raw" = "green"
"markup.quote" = "comment"

"diff.plus" = "green"
"diff.minus" = "red"
"diff.delta" = "blue"

"ui.background" = { fg = "syntax", bg = "background" }
"ui.text" = "foreground"
"ui.text.focus" = { fg = "foreground", bg = "panel", modifiers = ["bold"] }
"ui.text.inactive" = "comment"
"ui.text.directory" = "blue"
"ui.linenr" = "comment"
"ui.linenr.selected" = { fg = "foreground", modifiers = ["bold"] }
"ui.statusline" = { fg = "foreground", bg = "panel" }
"ui.statusline.inactive" = { fg = "comment", bg = "panel" }
"ui.statusline.normal" = { fg = "background", bg = "accent", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "background", bg = "green", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "background", bg = "purple", modifiers = ["bold"] }
"ui.popup" = { fg = "foreground", bg = "panel" }
"ui.window" = "comment"
"ui.help" = { fg = "foreground", bg = "panel" }
"ui.bufferline" = { fg = "comment", bg = "panel" }
"ui.bufferline.active" = { fg = "foreground", bg = "background", underline = { color = "accent", style = "line" } }
"ui.virtual" = "comment"
"ui.virtual.ruler" = { bg = "panel" }
"ui.virtual.indent-guide" = "comment"
"ui.virtual.inlay-hint" = "comment"
"ui.virtual.jump-label" = { fg = "orange", modifiers = ["bold"] }
"ui.virtual.whitespace" = "comment"
"ui.selection" = { bg = "selection" }
"ui.cursor" = { fg = "background", bg = "accent" }
"ui.cursor.primary" = { fg = "background", bg = "accent" }
"ui.cursor.match" = { fg = "yellow", modifiers = ["bold"] }
"ui.cursorline.primary" = { bg = "panel" }
"ui.highlight" = { bg = "selection" }
"ui.menu" = { fg = "foreground", bg = "panel" }
"ui.menu.selected" = { fg = "background", bg = "accent", modifiers = ["bold"] }

"diagnostic.error" = { underline = { color = "red", style = "curl" } }
"diagnostic.warning" = { underline = { color = "yellow", style = "curl" } }
"diagnostic.info" = { underline = { color = "blue", style = "curl" } }
"diagnostic.hint" = { underline = { color = "cyan", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }
error = "red"
warning = "yellow"
info = "blue"
hint = "cyan"

[palette]
background = "#09090b"
panel = "#171717"
selection = "#212121"
foreground = "#fafafa"
accent = "#e5e5e5"
syntax = "#abb2bf"
comment = "#828997"
red = "#e06c75"
orange = "#d19a66"
yellow = "#e5c07b"
green = "#98c379"
cyan = "#56b6c2"
blue = "#61afef"
purple = "#c678dd"
